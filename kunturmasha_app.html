<style>
  :root{
    --ink:#0B2E52;
    --well:#1971B8;
    --aqua:#2E9FE0;
    --clay:#E8A33D;
    --mist:#EAF4FB;
    --bar-bg:#0B2039;
    --bar-line: rgba(255,255,255,0.10);
    --pill-idle: rgba(255,255,255,0.06);
    --pill-idle-text: rgba(255,255,255,0.68);
    --pill-active-bg: var(--aqua);
    --pill-active-text: #06182b;
    --group-label: rgba(255,255,255,0.38);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%; background:var(--mist); overflow:hidden;}
  body{font-family:'Inter', sans-serif;}

  #bar{
    position:fixed; top:0; left:0; right:0; height:52px; z-index:100;
    display:flex; align-items:center; gap:18px;
    padding:0 16px;
    background:var(--bar-bg);
    border-bottom:1px solid var(--bar-line);
    overflow-x:auto; overflow-y:hidden;
    white-space:nowrap;
    scrollbar-width:thin;
  }
  #bar::-webkit-scrollbar{height:5px;}
  #bar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:3px;}

  .brandmark{
    display:flex; align-items:center; gap:8px; flex:0 0 auto;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.98rem;
    color:#fff; letter-spacing:-0.01em;
  }
  .brandmark .dot{width:8px;height:8px;border-radius:50%; background:var(--aqua); box-shadow:0 0 0 3px rgba(46,159,224,0.25); flex:0 0 auto;}
  .brandmark .tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; font-weight:600;
    color:var(--pill-idle-text); text-transform:uppercase; letter-spacing:0.06em;
    border:1px solid var(--bar-line); border-radius:100px; padding:2px 8px;
  }

  .sep{flex:0 0 auto; width:1px; height:22px; background:var(--bar-line);}

  .group{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
  .group .glabel{
    font-family:'IBM Plex Mono', monospace; font-size:0.66rem; font-weight:600;
    color:var(--group-label); text-transform:uppercase; letter-spacing:0.07em;
    margin-right:2px; flex:0 0 auto;
  }
  .pill{
    flex:0 0 auto;
    font-family:'Inter', sans-serif; font-size:0.8rem; font-weight:500;
    color:var(--pill-idle-text); background:var(--pill-idle);
    border:1px solid transparent; border-radius:100px;
    padding:7px 13px; cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .pill:hover{background:rgba(255,255,255,0.12); color:#fff;}
  .pill.active{background:var(--pill-active-bg); color:var(--pill-active-text); font-weight:600;}

  #stage{
    position:fixed; top:52px; left:0; right:0; bottom:0;
    background:var(--mist);
  }
  #frame{
    width:100%; height:100%; border:none; display:block; background:#fff;
  }

  @media (max-width: 720px){
    .group .glabel{display:none;}
    .brandmark .tag{display:none;}
  }
</style>

  var DEFAULT_PAGE = 'index';
  var frame = document.getElementById('frame');
  var pills = Array.prototype.slice.call(document.querySelectorAll('.pill'));

  function decode(key){
    var b64 = PAGES_B64[key];
    if(!b64) return null;
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0; i<bin.length; i++){ bytes[i] = bin.charCodeAt(i); }
    return new TextDecoder('utf-8').decode(bytes);
  }

  function setActivePill(key){
    pills.forEach(function(p){ p.classList.toggle('active', p.dataset.page === key); });
  }

  function render(key){
    if(!PAGES_B64[key]) key = DEFAULT_PAGE;
    var html = decode(key);
    frame.srcdoc = html;
    setActivePill(key);
    document.title = 'KunturMasha — ' + key;
  }

  function navigate(key, push){
    if(location.hash.slice(1) !== key){
      location.hash = key;
    } else {
      render(key);
    }
  }

  window.addEventListener('hashchange', function(){
    var key = location.hash.replace('#','') || DEFAULT_PAGE;
    render(key);
  });

  window.addEventListener('message', function(e){
    if(e && e.data && e.data.kmNav){
      navigate(e.data.kmNav);
    }
  });

  pills.forEach(function(p){
    p.addEventListener('click', function(){ navigate(p.dataset.page); });
  });

  var initial = location.hash.replace('#','') || DEFAULT_PAGE;
  render(initial);
</script>
